version: "3.8"

services:
  # ── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: securemeet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securemeet}
      POSTGRES_USER: ${DB_USER:-securemeet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securemeet123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securemeet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OpenVidu ──────────────────────────────────────────────────
  openvidu:
    image: openvidu/openvidu-dev:2.30.0
    container_name: securemeet_openvidu
    restart: unless-stopped
    environment:
      - OPENVIDU_SECRET=${OPENVIDU_SECRET:-MY_SECRET}
      - DOMAIN_OR_PUBLIC_IP=${DOMAIN:-localhost}
      - HTTPS_PORT=4443
      - HTTP_PORT=5080
      - OPENVIDU_RECORDING=false
    ports:
      - "4443:4443"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:4443"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Spring Boot backend ──────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: securemeet_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openvidu:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-securemeet}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-securemeet}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-securemeet123}
      APP_JWT_SECRET: ${JWT_SECRET:-SecureMeetJwtSecretKey2024MustBe256BitsLongForHS256Algorithm!!}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      OPENVIDU_URL: https://openvidu:4443
      OPENVIDU_SECRET: ${OPENVIDU_SECRET:-MY_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: securemeet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: securemeet_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
