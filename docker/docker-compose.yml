version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: securemeet_db
    environment:
      POSTGRES_DB: securemeet
      POSTGRES_USER: securemeet
      POSTGRES_PASSWORD: securemeet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securemeet_network

  openvidu:
    image: openvidu/openvidu-dev:2.30.0
    container_name: securemeet_openvidu
    environment:
      - OPENVIDU_SECRET=MY_SECRET
      - DOMAIN_OR_PUBLIC_IP=localhost
      - HTTPS_PORT=4443
      - HTTP_PORT=5080
      - OPENVIDU_RECORDING=false
    ports:
      - "4443:4443"
      - "5080:5080"
    networks:
      - securemeet_network

volumes:
  postgres_data:

networks:
  securemeet_network:
    driver: bridge
